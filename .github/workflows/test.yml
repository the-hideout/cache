name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v6
        with:
          go-version-file: 'src/cache/go.mod'

      - name: bootstrap
        run: script/bootstrap

      - name: lint
        run: script/lint

      - name: build
        run: script/build
    
      - name: test
        run: script/test
